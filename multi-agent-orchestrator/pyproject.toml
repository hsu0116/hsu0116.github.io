[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "Claude Code x OpenAI Codex multi-agent orchestrator using git worktrees"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real claude/codex CLIs (costs money; run with -m live)"]
addopts = "-m 'not live'"
