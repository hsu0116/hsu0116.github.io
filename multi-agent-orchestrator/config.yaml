# Multi-agent orchestrator configuration. Every key is optional; omitted keys use the
# defaults in orchestrator/config.py. Commands are always argument lists (never shell strings).
#
# Billing: agents ALWAYS use your subscription logins (Claude Pro/Max via `claude` login, ChatGPT via
# `codex login`). API keys are stripped from agent processes and API-key logins are refused; this
# cannot be turned off here. See orchestrator/subscription.py.

agents:
  planner: claude
  workers:                       # role hints given to the planner (roles are assigned dynamically)
    - provider: codex
      role: backend
    - provider: claude
      role: frontend
    - provider: codex
      role: testing
  reviewers:                     # cross review: claude reviews codex code and vice versa
    - claude
    - codex
  repair_default: claude
  fallback_on_unavailable: true  # reassign tasks if a CLI is missing / not logged in

providers:
  claude:
    command: null                # e.g. ["C:/Users/me/.local/bin/claude.exe"]; null = find on PATH
    model: null                  # e.g. claude-sonnet-5-5 ; null = CLI default
    max_budget_usd_per_call: 5.0     # usage cap per call (API-equivalent estimate; Pro is not billed per call)
  codex:
    command: null                # null = find on PATH (npm .cmd shim is resolved to node + js)
    model: null
    worker_sandbox: workspace-write
    reviewer_sandbox: read-only

limits:
  max_parallel_workers: 3
  max_parallel_reviewers: 2
  max_repair_rounds: 2
  max_task_retries: 1
  task_timeout_seconds: 1800
  max_tasks: 8
  max_total_cost_usd: null       # usage cap per run (API-equivalent estimate), e.g. 5.0

integration:
  method: cherry-pick
  require_manual_main_merge: true
  auto_push: false

validation:
  test_command: auto             # or e.g. ["python", "-m", "pytest", "-q"] / ["npm", "test"]
  run_tests_per_task: false
  scope_violation: fail
  allow_deletions: false
  blocking_severities: [critical, high]

review:
  enabled: true
  required: true

storage:
  type: sqlite
  data_dir: data                 # relative to this file

logging:
  save_agent_output: true
  save_git_diff: true
  save_test_results: true
